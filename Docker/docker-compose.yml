version: '3.8'

services:
  node-basic:
    build:
      context: ..
      dockerfile: Docker/BasicDockerfileNode
    ports:
      - "3000:3000"
    container_name: node-app-basic
    restart: unless-stopped

  node-multi:
    build:
      context: ..
      dockerfile: Docker/MultiStageDockerfileNode
    ports:
      - "3001:3000"
    container_name: node-app-multi
    restart: unless-stopped
    volumes:
      - node_multi_data:/app/data

volumes:
  node_multi_data:
    driver: local
