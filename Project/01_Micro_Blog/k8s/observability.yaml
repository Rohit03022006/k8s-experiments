apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: microservice-alerts
  namespace: prod
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
  - name: application.rules
    rules:
    - alert: HighCPUUsage
      expr: sum(rate(container_cpu_usage_seconds_total{namespace="prod"}[5m])) by (pod) > 0.8
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "High CPU Usage on Pod {{ $labels.pod }}"
        description: "Pod {{ $labels.pod }} is experiencing CPU usage consistently above 80% for 2 minutes."
        
    - alert: PodFrequentRestarts
      expr: changes(kube_pod_container_status_restarts_total{namespace="prod"}[15m]) > 2
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Pod {{ $labels.pod }} is crashlooping"
        description: "Pod {{ $labels.pod }} has restarted more than 2 times in the last 15 minutes. Investigate immediately."
        
    - alert: DatabaseUnavailable
      expr: absent(up{app="mysql", namespace="prod"}) or up{app="mysql", namespace="prod"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "MySQL Database is down"
        description: "MySQL StatefulSet in prod namespace is not reachable."
